name: tmp-tgtest
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request
          tok = os.environ.get('TG_TOKEN', '').strip()
          chat = os.environ.get('TG_CHAT_ID', '').strip()
          print('token_len=%d chat=%r' % (len(tok), chat))
          if not tok or not chat:
              print('MISSING'); raise SystemExit(1)
          body = urllib.parse.urlencode({'chat_id': chat,
                                         'text': '【测试】cloudtransfer-subtitle 流程 TG 报告连通性\n来源: tmp-tgtest',
                                         'disable_web_page_preview': 'true'}).encode()
          req = urllib.request.Request('https://api.telegram.org/bot%s/sendMessage' % tok,
                                       data=body, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as x:
                  d = json.loads(x.read().decode())
              print('send_ok=%s message_id=%s chat_id=%s' % (
                  d.get('ok'), (d.get('result') or {}).get('message_id'),
                  ((d.get('result') or {}).get('chat') or {}).get('id')))
          except Exception as e:
              print('send_fail=%s' % str(e)[:200]); raise
          PY
