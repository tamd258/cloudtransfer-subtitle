name: subtitle-report

# 字幕批量进度报告 -> run 日志 + Telegram(定时 + 手动)
#   统计源目录(ydy2:五星)的组数/完成数/待办数/孤儿 srt, 结合最近运行状态。
# Secrets: RCLONE_CONF / PATHS_JSON / GH_TOKEN / YDY_DAV_TOKEN / TG_TOKEN / TG_CHAT_ID

on:
  schedule:
    # 每 2 小时 (UTC)
    # 错峰: 挪到 :43 —— 账号内多个 */3、*/4、*/6 定时任务都在 :00 起跑;
    #       :43 全账号无冲突(20 并发额度为账号级共享)。
    - cron: "43 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: subtitle-report
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf


      - name: 追加 ydy2(139 个人云) WebDAV 远端
        env:
          YDY_DAV_TOKEN: ${{ secrets.YDY_DAV_TOKEN }}
        run: |
          printf '\n[ydy2]\ntype = webdav\nurl = https://abcd.tammader.de5.net/dav/ydy2\nvendor = other\nbearer_token = %s\n' "$YDY_DAV_TOKEN" >> ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 统计并打印报告(并发 Telegram)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 subtitle_progress.py
