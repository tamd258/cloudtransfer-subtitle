name: tmp-fetch-srt

# 临时: 把源目录指定 srt 打包成 artifact(用于本地质量对比), 用完即删
on:
  workflow_dispatch:
    inputs:
      include:
        description: "文件名过滤(glob)"
        required: false
        default: "*.srt"
      sub_dir:
        description: "源目录(默认 out4)"
        required: false
        default: "out4"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: 拉文件并改哈希名
        env:
          INC: ${{ inputs.include }}
          SUBDIR: ${{ inputs.sub_dir }}
        run: |
          mkdir -p out
          rclone copy "gd6x:$SUBDIR" out --include "$INC" --fast-list
          echo "拉到 $(ls out | wc -l) 个文件"
          python3 - <<'PYEOF'
          import hashlib, os, shutil
          mapping = []
          for f in sorted(os.listdir('out')):
              h = hashlib.sha1(f.encode('utf-8')).hexdigest()[:12]
              shutil.move(os.path.join('out', f), os.path.join('out', h + '.srt'))
              mapping.append('%s.srt <= %s' % (h, f))
          with open('out/_mapping.txt', 'w', encoding='utf-8') as fh:
              fh.write('\\n'.join(mapping))
          print('映射 %d 条' % len(mapping))
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: srt-fetch
          path: out
          retention-days: 1
