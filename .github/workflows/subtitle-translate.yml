name: subtitle-translate

# 日文语音视频 → 日文 SRT 字幕(纯云端, 不翻译, 不烧录)
#   分片按「番号」归组 → ffmpeg 拼整片 → faster-whisper(large-v3) 日文转写
#   → 按标点重切成字幕行(单条 <=8s / <=42字) → 每个视频文件旁写同名 .srt 上传
#
# 公开仓库: 日志全部脱敏(logmask), 真实盘名/目录名/番号/链接均不出现明文。
# Secrets: RCLONE_CONF / PATHS_JSON / GH_TOKEN / YDY_DAV_TOKEN / TG_TOKEN / TG_CHAT_ID
# (不翻译: 不调用任何 LLM 网关, 不需要 SUBTITLE_API_* / TRANSLATE_*)

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真跑(转写+上传 srt), false=只列分组统计"
        required: false
        default: "false"
      only:
        description: "只处理某一组(按番号, 留空=全部)"
        required: false
        default: ""
      limit_groups:
        description: "最多处理前 N 组(0=不限)"
        required: false
        default: "1"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      whisper_model:
        description: "ASR 模型(kotoba-whisper-v2.0-faster 日语专用, 推荐 / large-v3 通用 / large-v3-turbo 快)"
        required: false
        default: "kotoba-whisper-v2.0-faster"
      probe_only:
        description: "验证用: 只转写前 N 秒(如 120), 不上传; 0=正常全量"
        required: false
        default: "0"
      batch_tag:
        description: "批次标识(仅用于并发分组, 留空=用 run_id)"
        required: false
        default: ""
      start_index:
        description: "从待处理列表第 K 个开始(并行分批); 配合 limit_groups 划分区间"
        required: false
        default: "0"
      force:
        description: "配合 only: 即使已有同名 srt 也强制重跑"
        required: false
        default: "false"
      file:
        description: "单文件验证模式: 只处理该文件(相对源目录, 可含子目录, 如 字幕版/xxx.mp4)"
        required: false
        default: ""
      src_remote:
        description: "临时覆盖源远端(如 gd6x); 留空=用 PATHS_JSON 的 SUB_SRC"
        required: false
        default: ""
      src_dir:
        description: "临时覆盖源目录(如 out3); 留空=用 PATHS_JSON 的 SUB_DIR"
        required: false
        default: ""

concurrency:
  group: subtitle-translate-${{ inputs.batch_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  # 手动 dispatch 可临时覆盖源(留空则走 PATHS_JSON 的 SUB_SRC/SUB_DIR)
  SUB_SRC: ${{ inputs.src_remote || '' }}
  SUB_DIR: ${{ inputs.src_dir || '' }}
  # 中译开关: 仓库 Variables 里 TRANSLATE_ZH=true 即中译(默认关, 只出日文 srt)
  TRANSLATE: ${{ vars.TRANSLATE_ZH || 'false' }}
  SUBTITLE_API_BASE: ${{ secrets.SUBTITLE_API_BASE }}
  SUBTITLE_API_KEY: ${{ secrets.SUBTITLE_API_KEY }}
  SUBTITLE_MODEL: ${{ vars.SUBTITLE_MODEL || 'deepseek-v4-flash' }}
  SUBTITLE_MODEL_FB: ${{ vars.SUBTITLE_MODEL_FB || 'gemma-4-31b-it' }}
  # --- ASR 质量(2026-11-20 升级: 日语专用模型 + 束搜索 + 转写后 LLM 校对) ---
  ASR_MODEL: ${{ vars.ASR_MODEL || 'kotoba-whisper-v2.0-faster' }}
  ASR_FALLBACK: ${{ vars.ASR_FALLBACK || 'large-v3' }}
  ASR_FIX: ${{ vars.ASR_FIX || 'on' }}
  ASR_FIX_MODEL: ${{ vars.ASR_FIX_MODEL || 'deepseek-v4-flash' }}
  MAX_SEG_DUR: ${{ vars.MAX_SEG_DUR || '8' }}      # 单条字幕最长秒数
  MAX_SEG_CHARS: ${{ vars.MAX_SEG_CHARS || '42' }} # 单条字幕最长字数
  WHISPER_THREADS: ${{ vars.WHISPER_THREADS || '4' }}
  WHISPER_BATCH: ${{ vars.WHISPER_BATCH || '8' }}
  WHISPER_BEAM: ${{ vars.WHISPER_BEAM || '5' }}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 准备 ffmpeg
        # 不走 apt: 20 个 job 同时 apt-get 会互相拖(实测同一步 16s ~ 861s),
        # 而真正转写只要 90 秒 —— 槽位不能耗在装包上。
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "镜像自带 ffmpeg, 跳过安装"
            ffmpeg -version | head -1
            exit 0
          fi
          echo "镜像里没有 ffmpeg, 先试 BtbN 的 GitHub 静态构建"
          ok=0
          if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
               -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             && sudo mkdir -p /opt/ff \
             && sudo tar -xJf /tmp/ff.tar.xz -C /opt/ff --strip-components=1; then
            ff=$(sudo find /opt/ff -type f -name ffmpeg | head -1)
            fp=$(sudo find /opt/ff -type f -name ffprobe | head -1)
            if [ -n "$ff" ] && [ -n "$fp" ]; then
              sudo ln -sf "$ff" /usr/local/bin/ffmpeg
              sudo ln -sf "$fp" /usr/local/bin/ffprobe
              ok=1
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "静态包也没成, 退回 apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"
          grep -E '^\[' ~/.config/rclone/rclone.conf | sed 's/$/: <masked>/'


      - name: 追加 ydy2(139 个人云) WebDAV 远端
        env:
          YDY_DAV_TOKEN: ${{ secrets.YDY_DAV_TOKEN }}
        run: |
          printf '\n[ydy2]\ntype = webdav\nurl = https://abcd.tammader.de5.net/dav/ydy2\nvendor = other\nbearer_token = %s\n' "$YDY_DAV_TOKEN" >> ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 与 whisper 模型权重
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: sub-${{ runner.os }}-pip-hf-v2

      - name: 装 faster-whisper
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "av==18.1.0" "ctranslate2==4.8.5" "faster-whisper==1.2.1"
          python3 -c "import faster_whisper, av, ctranslate2; print('fw', faster_whisper.__version__, '| av', av.__version__, '| ct2', ctranslate2.__version__)"

      - name: 跑字幕流水线(只出日文 srt)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply || 'false' }}
          ONLY: ${{ inputs.only || '' }}
          LIMIT_GROUPS: ${{ inputs.limit_groups || '1' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          WHISPER_MODEL: ${{ inputs.whisper_model || vars.ASR_MODEL || 'kotoba-whisper-v2.0-faster' }}
          PROBE_ONLY: ${{ inputs.probe_only || '0' }}
          START_INDEX: ${{ inputs.start_index || '0' }}
          FORCE: ${{ inputs.force || 'false' }}
          ONLY_FILE: ${{ inputs.file || '' }}
        run: |
          set -e
          if [ -n "$ONLY_FILE" ]; then
            echo "(单文件验证模式)"
            ARGS="--budget-min $BUDGET_MIN --file $ONLY_FILE"
            if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
            python3 subtitle_translate.py $ARGS
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            APPLY="true"; LIMIT_GROUPS="3"; START_INDEX="0"
            ONLY=""
            echo "(定时触发: 处理3组, ASR=$(echo $WHISPER_MODEL))"
          fi
          ARGS="--limit-groups $LIMIT_GROUPS --budget-min $BUDGET_MIN --start-index $START_INDEX"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$PROBE_ONLY" != "0" ]; then ARGS="$ARGS --probe-only $PROBE_ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 subtitle_translate.py $ARGS

      - name: 磁盘余量
        if: always()
        run: df -h / | tail -1

      # 自接力: 本批干完立刻补满并行(不依赖 GitHub cron —— 实测 cron 会数小时不响)。
      # 单文件验证 / 临时覆盖源 模式下绝不自接力(2026-11-20 实测: 单文件测试误发 7 个全量批次)。
      - name: 自接力补满并行
        # !cancelled(): 被取消的 run 不许再自接力 —— 否则一取消就触发 relay 洪水
        # (2026-11-18 实测: 取消 20 个批次 → 瞬间多出 ~50 个重复批次)
        # 验证模式(file / 覆盖源 / probe 探针)一律不自接力:
        # (2026-11-20 补 probe_only —— 否则一次断句探针测试会误发 8 个全量批次)
        if: ${{ !cancelled() && (inputs.file || '') == '' && (inputs.src_remote || '') == '' && (inputs.probe_only || '0') == '0' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 不传的话 subtitle_dispatch.py 会用脚本默认值(20 并发/每批 3 组),
          # 和仓库 Variables 脱节 —— 实测派出一堆越界空批次(si=39/57)。
          TARGET_PARALLEL: ${{ vars.TARGET_PARALLEL || '8' }}
          GROUPS_PER_RUN: ${{ vars.GROUPS_PER_RUN || '6' }}
        run: |
          sleep $((RANDOM % 25))
          python3 subtitle_dispatch.py

